<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HopeFund – Featured Campaigns</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --primary: #0f766e;
      --primary-dark: #0d9488;
      --primary-light: #ccfbf1;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --radius: 10px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    
    html::-webkit-scrollbar,
    body::-webkit-scrollbar {
      display: none;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #ffffff;
      color: var(--text);
      line-height: 1.45;
      -webkit-font-smoothing: antialiased;
    }

    main {
      width: 100%;
      padding: 0 10px 20px;
    }

    .sticky-top {
      position: sticky;
      top: 0;
      background: #ffffff;
      z-index: 100;
      padding-top: 10px;
      padding-bottom: 2px;
      border-bottom: 1px solid rgba(226, 232, 240, 0.6);
    }

    .header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 0;
    }

    .header-title {
      font-size: 1.2rem;
      font-weight: 700;
      line-height: 1.2;
      white-space: nowrap;
    }

    .header-title.hidden { display: none; }

    .search-container {
      display: flex;
      align-items: center;
      flex: 1;
      justify-content: flex-end;
      width: 100%;
    }

    .search-icon-btn {
      background: none;
      border: none;
      padding: 0;
      margin: 0;
      cursor: pointer;
      color: var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
    }

    .search-icon-btn svg {
      width: 1.6rem;
      height: 1.6rem;
    }

    .search-icon-btn:hover { color: var(--primary-dark); }

    .search-expanded {
      display: none;
      width: 100%;
      position: relative;
    }

    .search-expanded.active { display: block; }

    .search-input {
      width: 100%;
      padding: 8px 34px 8px 12px;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      font-size: 0.875rem;
      font-family: inherit;
      outline: none;
    }

    .search-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 2px rgb(15 118 110 / 0.12);
    }

    .search-close {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      width: 20px;
      height: 20px;
      border: none;
      background: #e2e8f0;
      border-radius: 50%;
      color: #64748b;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .search-meta {
      font-size: 0.72rem;
      color: var(--text-muted);
      padding: 2px 2px 0px;
      min-height: 0px;
    }

    .filters-wrapper {
      width: 100%;
      overflow: hidden;
      margin: 1px 0 1px 0;
      padding: 4px 0;
    }

    .filters {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      white-space: nowrap;
      scrollbar-width: none;
    }

    .filters::-webkit-scrollbar { display: none; }

    .filter-btn {
      flex-shrink: 0;
      padding: 8px 16px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: #fff;
      color: var(--text-muted);
      font-size: 0.76rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .filter-btn:hover,
    .filter-btn.active {
      background: var(--primary-light);
      border-color: var(--primary);
      color: var(--primary);
    }

    .campaigns-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 12px;
      padding-top: 10px;
    }

    .campaign-card {
      background: #fff;
      border-radius: var(--radius);
      overflow: hidden;
      border: 1px solid var(--border);
      box-shadow: 0 1px 3px rgb(0 0 0 / 0.05);
      display: flex;
      flex-direction: column;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .campaign-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 8px rgb(0 0 0 / 0.08);
    }

    .campaign-card.ended { opacity: 0.88; }

    .campaign-image {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #e2e8f0;
      overflow: hidden;
    }

    .campaign-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .badge {
      position: absolute;
      top: 8px;
      left: 8px;
      background: rgba(255,255,255,0.96);
      padding: 3px 9px;
      border-radius: 999px;
      font-size: 0.68rem;
      font-weight: 600;
      color: var(--primary);
      z-index: 2;
      box-shadow: 0 1px 2px rgb(0 0 0 / 0.08);
    }

    .urgent-badge { background: #fef2f2; color: #dc2626; }
    .ended-badge { background: #f1f5f9; color: #64748b; }
    .funded-badge { background: #ecfdf5; color: #059669; }

    .campaign-body {
      padding: 11px;
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .campaign-title {
      font-size: 0.92rem;
      font-weight: 650;
      margin-bottom: 4px;
      line-height: 1.3;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .campaign-desc {
      color: var(--text-muted);
      font-size: 0.76rem;
      margin-bottom: 9px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      flex: 1;
    }

    mark.highlight {
      background-color: var(--primary-light);
      color: var(--primary);
      font-weight: 600;
      padding: 0 2px;
      border-radius: 3px;
    }

    .progress-section { margin-bottom: 9px; }

    .progress-info {
      display: flex;
      justify-content: space-between;
      margin-bottom: 4px;
      font-size: 0.73rem;
    }

    .raised { font-weight: 600; }
    .goal { color: var(--text-muted); }

    .progress-bar {
      height: 5px;
      background: #e2e8f0;
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--primary), #14b8a6);
      border-radius: 999px;
    }

    .progress-fill.complete,
    .progress-fill.near-goal {
      background: linear-gradient(90deg, #059669, #10b981);
    }

    .campaign-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 9px;
      font-size: 0.71rem;
      color: var(--text-muted);
    }

    .meta-item {
      display: flex;
      align-items: center;
      gap: 3px;
    }

    .meta-item.ended-text { color: #94a3b8; font-weight: 500; }

    .meta-item svg {
      width: 12px;
      height: 12px;
      opacity: 0.7;
    }

    .donate-btn {
      width: 100%;
      padding: 8px;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 7px;
      font-weight: 600;
      font-size: 0.84rem;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .donate-btn:hover { background: var(--primary-dark); }
    .donate-btn:disabled {
      background: #94a3b8;
      cursor: not-allowed;
    }

    .no-results {
      grid-column: 1 / -1;
      text-align: center;
      padding: 36px 12px;
      color: var(--text-muted);
    }

    @media (max-width: 600px) {
      main { padding: 0 8px 16px; }
      .campaigns-grid { grid-template-columns: 1fr; gap: 10px; }
    }
  </style>
</head>
<body>

  <main>
    <header class="sticky-top">
      <div class="header-row">
        <h2 class="header-title" id="headerTitle">Featured Campaigns</h2>

        <div class="search-container">
          <button class="search-icon-btn" id="searchIconBtn" type="button" title="Search">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.8" d="M21 21l-5.2-5.2m2.7-5.3a7.5 7.5 0 11-15 0 7.5 7.5 0 0115 0z"/>
            </svg>
          </button>

          <div class="search-expanded" id="searchExpanded">
            <input type="text" class="search-input" id="searchInput" placeholder="Search campaigns..." autocomplete="off" />
            <button class="search-close" id="searchClose" type="button">×</button>
          </div>
        </div>
      </div>

      <div class="search-meta" id="searchMeta"></div>

      <div class="filters-wrapper">
        <div class="filters">
          <button class="filter-btn active" data-category="all">All</button>
          <button class="filter-btn" data-category="education">Education</button>
          <button class="filter-btn" data-category="emergency">Emergency</button>
          <button class="filter-btn" data-category="medical">Medical</button>
          <button class="filter-btn" data-category="disaster">Disaster Relief</button>
          <button class="filter-btn" data-category="environment">Environment</button>
          <button class="filter-btn" data-category="health">Health</button>
        </div>
      </div>
    </header>

    <div class="campaigns-grid" id="campaignsGrid"></div>
  </main>

  <script>
    const campaigns = [
      {
        id: "991", category: "education",
        title: "Build a School for 200 Children in Rural Nepal",
        desc: "Help us construct safe classrooms, provide desks, and bring quality education to remote mountain villages.",
        image: "https://images.unsplash.com/photo-1509062522246-3755977927d7?auto=format&fit=crop&w=600&q=80",
        raised: 28450, goal: 45000, endDate: "2026-09-20", goalMetDate: null, donors: 342, urgent: false
      },
      {
        id: "992", category: "emergency",
        title: "Emergency Heart Surgery for 8-Year-Old Aisha",
        desc: "Aisha needs safe, life-saving surgery within weeks. Your donation covers hospital costs and post-op care.",
        image: "https://images.unsplash.com/photo-1584515979956-d9f6e5d09982?auto=format&fit=crop&w=600&q=80",
        raised: 41200, goal: 52000, endDate: "2026-09-08", goalMetDate: null, donors: 891, urgent: true
      },
      {
        id: "993", category: "environment",
        title: "Plant 50,000 Trees in the Amazon Rainforest",
        desc: "Restore degraded land and protect biodiversity by supporting local indigenous communities planting native species.",
        image: "https://images.unsplash.com/photo-1542601906990-b4d3fb778b09?auto=format&fit=crop&w=600&q=80",
        raised: 42000, goal: 35000, endDate: "2026-10-05", goalMetDate: "2026-09-02", donors: 612, urgent: false
      },
      {
        id: "994", category: "disaster",
        title: "Flood Relief & Shelter for 1,200 Families",
        desc: "Provide emergency food, clean water, and safe temporary housing after catastrophic flooding in the region.",
        image: "https://images.unsplash.com/photo-1547683905-f686c993aae5?auto=format&fit=crop&w=600&q=80",
        raised: 67900, goal: 80000, endDate: "2026-09-15", goalMetDate: null, donors: 1204, urgent: true
      },
      {
        id: "995", category: "education",
        title: "Scholarships for 100 Girls in STEM Programs",
        desc: "Empower young women with access to quality STEM education, mentorship, and career opportunities.",
        image: "https://images.unsplash.com/photo-1523240795612-9a054b0db644?auto=format&fit=crop&w=600&q=80",
        raised: 12350, goal: 25000, endDate: "2026-10-15", goalMetDate: null, donors: 276, urgent: false
      },
      {
        id: "996", category: "health",
        title: "Clean Water Wells for 15 Villages in Kenya",
        desc: "Install sustainable water wells and train local teams so communities have safe drinking water year-round.",
        image: "https://images.unsplash.com/photo-1541888946425-d0fbb186a5b3?auto=format&fit=crop&w=600&q=80",
        raised: 33100, goal: 40000, endDate: "2026-09-12", goalMetDate: null, donors: 648, urgent: false
      },
      {
        id: "997", category: "medical",
        title: "Cancer Treatment Fund for Single Mother of Three",
        desc: "Support Maria’s chemotherapy and recovery so she can return home safely to her children cancer-free.",
        image: "https://images.unsplash.com/photo-1516549655169-df83a0774514?auto=format&fit=crop&w=600&q=80",
        raised: 18500, goal: 30000, endDate: "2026-09-28", goalMetDate: null, donors: 412, urgent: false
      },
      {
        id: "998", category: "emergency",
        title: "Earthquake Recovery Kits for 800 Households",
        desc: "Deliver essential supplies, temporary safe shelters, and medical aid to families affected by the recent quake.",
        image: "https://images.unsplash.com/photo-1469571486292-0ba58a3f068b?auto=format&fit=crop&w=600&q=80",
        raised: 22400, goal: 50000, endDate: "2026-09-18", goalMetDate: null, donors: 389, urgent: true
      }
    ];

    let currentCategory = "all";
    let currentSearch = "";

    function getCampaignStatus(c) {
      const now = new Date();
      const end = new Date(c.endDate + "T23:59:59");
      const isGoalReached = c.raised >= c.goal;

      // Rule: Keep completed campaigns in feed for 7 days after reaching goal
      if (isGoalReached && c.goalMetDate) {
        const metDate = new Date(c.goalMetDate + "T00:00:00");
        const daysSinceGoalMet = Math.floor((now - metDate) / (1000 * 60 * 60 * 24));
        if (daysSinceGoalMet > 7) {
          return { show: false };
        }
      }

      const daysPassed = Math.floor((now - end) / (1000 * 60 * 60 * 24));

      if (daysPassed < 0) {
        const daysLeft = Math.ceil((end - now) / (1000 * 60 * 60 * 24));
        return {
          show: true,
          isEnded: false,
          isGoalReached: isGoalReached,
          daysLeft: daysLeft,
          text: daysLeft + (daysLeft === 1 ? " day left" : " days left")
        };
      }

      if (daysPassed <= 7) {
        let text = "Ended today";
        if (daysPassed === 1) text = "Ended 1 day ago";
        else if (daysPassed > 1) text = "Ended " + daysPassed + " days ago";
        return { show: true, isEnded: true, isGoalReached: isGoalReached, daysLeft: 0, text: text };
      }

      return { show: false };
    }

    function calculateScore(c, status) {
      let score = 0;

      // Rule: Urgent / Emergency campaigns always receive top priority score (+1000)
      if (c.urgent || c.category === "emergency") {
        score += 1000;
      }

      const pct = (c.raised / c.goal) * 100;

      // Priority boost for active campaigns that are still accepting over-funding
      if (status.isGoalReached) {
        score += 150; 
      } else {
        score += pct * 2; 
      }

      score += c.donors * 0.1;

      if (status.isEnded) {
        score -= 500;
      }

      return score;
    }

    function formatMoney(n) {
      return "$" + n.toLocaleString();
    }

    function highlightText(text, query) {
      if (!query) return text;
      const escapedQuery = query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      const regex = new RegExp(`(${escapedQuery})`, 'gi');
      return text.replace(regex, '<mark class="highlight">$1</mark>');
    }

    function getList() {
      return campaigns
        .map(c => {
          const status = getCampaignStatus(c);
          return { data: c, status, score: status.show ? calculateScore(c, status) : -9999 };
        })
        .filter(item => {
          if (!item.status.show) return false;
          const c = item.data;
          const matchCat = currentCategory === "all" || c.category === currentCategory;
          const q = currentSearch.toLowerCase().trim();
          const matchSearch = !q ||
            c.title.toLowerCase().includes(q) ||
            c.desc.toLowerCase().includes(q) ||
            c.category.toLowerCase().includes(q);
          return matchCat && matchSearch;
        })
        .sort((a, b) => b.score - a.score);
    }

    function render() {
      const grid = document.getElementById("campaignsGrid");
      const meta = document.getElementById("searchMeta");
      const list = getList();
      const q = currentSearch.trim();

      meta.textContent = q
        ? (list.length === 0 ? "No campaigns found" : list.length + " found")
        : "";

      if (list.length === 0) {
        grid.innerHTML = '<div class="no-results"><h3>No campaigns found</h3><p>Try a different keyword or category.</p></div>';
        return;
      }

      let html = "";
      list.forEach(item => {
        const c = item.data;
        const status = item.status;
        const pct = Math.min(100, Math.round((c.raised / c.goal) * 100));
        const isComplete = c.raised >= c.goal;
        const near = pct >= 75;

        let badgeClass = "badge";
        let badgeText = c.category.charAt(0).toUpperCase() + c.category.slice(1);

        if (c.urgent || c.category === "emergency") {
          badgeClass = "badge urgent-badge";
          badgeText = "Urgent";
        } else if (isComplete) {
          badgeClass = "badge funded-badge";
          badgeText = "Goal Reached";
        } else if (status.isEnded) {
          badgeClass = "badge ended-badge";
          badgeText = "Ended";
        }

        const cardClass = status.isEnded ? "campaign-card ended" : "campaign-card";
        const metaClass = status.isEnded ? "meta-item ended-text" : "meta-item";
        const fillClass = isComplete ? "progress-fill complete" : (near ? "progress-fill near-goal" : "progress-fill");
        const btnDisabled = status.isEnded;
        const btnText = status.isEnded ? "Campaign Ended" : "Donate Now";

        const fallback = "https://via.placeholder.com/600x340/0f766e/ffffff?text=" + encodeURIComponent(c.category);

        const highlightedTitle = highlightText(c.title, q);
        const highlightedDesc = highlightText(c.desc, q);

        html += `
          <article class="${cardClass}" data-id="${c.id}">
            <div class="campaign-image">
              <img src="${c.image}" alt="${c.title}" loading="lazy"
                   onerror="this.onerror=null; this.src='${fallback}';" />
              <span class="${badgeClass}">${badgeText}</span>
            </div>
            <div class="campaign-body">
              <h3 class="campaign-title">${highlightedTitle}</h3>
              <p class="campaign-desc">${highlightedDesc}</p>
              <div class="progress-section">
                <div class="progress-info">
                  <span class="raised">${formatMoney(c.raised)} raised</span>
                  <span class="goal">of ${formatMoney(c.goal)}</span>
                </div>
                <div class="progress-bar">
                  <div class="${fillClass}" style="width: ${pct}%"></div>
                </div>
              </div>
              <div class="campaign-meta">
                <div class="${metaClass}">
                  <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                  ${status.text}
                </div>
                <div class="meta-item">
                  <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
                  ${c.donors.toLocaleString()} donors
                </div>
              </div>
              <button class="donate-btn" ${btnDisabled ? "disabled" : ""}>${btnText}</button>
            </div>
          </article>`;
      });

      grid.innerHTML = html;

      grid.querySelectorAll(".campaign-card").forEach(card => {
        card.addEventListener("click", function(e) {
          const campaignId = this.getAttribute("data-id");

          if (e.target.classList.contains("donate-btn")) {
            e.stopPropagation();
            window.location.href = `https://mydomain.com/donate/fundraiser/${campaignId}`;
            return;
          }

          window.location.href = `https://mydomain.com/fundraiser/${campaignId}`;
        });
      });
    }

    const searchIconBtn = document.getElementById("searchIconBtn");
    const searchExpanded = document.getElementById("searchExpanded");
    const searchInput = document.getElementById("searchInput");
    const searchClose = document.getElementById("searchClose");
    const headerTitle = document.getElementById("headerTitle");

    function closeSearch() {
      searchExpanded.classList.remove("active");
      searchIconBtn.style.display = "flex";
      headerTitle.classList.remove("hidden");
      searchInput.value = "";
      currentSearch = "";
    }

    searchIconBtn.addEventListener("click", () => {
      searchIconBtn.style.display = "none";
      searchExpanded.classList.add("active");
      headerTitle.classList.add("hidden");
      searchInput.focus();
    });

    searchClose.addEventListener("click", () => {
      closeSearch();
      render();
    });

    searchInput.addEventListener("input", function() {
      currentSearch = this.value;
      render();
    });

    document.querySelectorAll(".filter-btn").forEach(btn => {
      btn.addEventListener("click", function() {
        document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
        this.classList.add("active");
        currentCategory = this.getAttribute("data-category");

        if (searchExpanded.classList.contains("active") || currentSearch) {
          closeSearch();
        }

        render();
      });
    });

    render();
  </script>
</body>
</html>
